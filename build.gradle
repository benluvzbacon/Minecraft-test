plugins {
    id 'fabric-loom' version '1.8.13'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    splitEnvironmentSourceSets()
    mods {
        riftborn {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client { runDir 'run/client' }
        server { runDir 'run/server' }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
test { useJUnitPlatform() }
jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}

// Separate development-only mods: none of this code is bundled into the distributable jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    smoketest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.client.runtimeClasspath + sourceSets.client.output
    }
}
loom {
    mods {
        riftborn_test { sourceSet sourceSets.gametest }
        riftborn_smoketest { sourceSet sourceSets.smoketest }
    }
    runs {
        gametest {
            server()
            name 'Riftborn GameTests'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest/results.xml').get().asFile}"
            vmArg '-Xmx1536m'
        }
        clientSmoke {
            client()
            name 'Riftborn multiplayer client smoke test'
            source sourceSets.smoketest
            runDir 'run/smoke-client'
            vmArg '-Xmx1536m'
            programArgs '--username', 'RiftbornTester'
        }
        smokeServer {
            server()
            name 'Riftborn isolated smoke server'
            runDir 'build/smoke-server'
            vmArg '-Xmx1536m'
            programArg 'nogui'
        }
        server { vmArg '-Xmx1536m' }
    }
}
tasks.named('runServer') { standardInput = System.in }
tasks.named('runSmokeServer') { standardInput = System.in }
tasks.named('runGametest') {
    doFirst { file('build/gametest').mkdirs() }
}
tasks.named('check') { dependsOn 'compileGametestJava', 'compileSmoketestJava' }

// Stable archives make a rebuilt release easy to compare by checksum.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
