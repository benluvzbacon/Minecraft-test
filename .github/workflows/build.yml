name: Build Riftborn 2.0

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Riftborn Mod JAR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Verify generated resources are reproducible
        run: |
          python3 scripts/generate_assets.py
          python3 scripts/generate_data.py
          python3 scripts/generate_structures.py
          python3 scripts/generate_awakening.py
          python3 scripts/generate_awakening_assets.py
          python3 scripts/generate_awakening_structures.py
          git diff --exit-code -- src/main/resources src/gametest/resources

      - name: Run Gradle build
        run: ./gradlew clean build --no-daemon

      - name: Audit remapped production JAR
        run: python3 scripts/verify_jar.py

      - name: Upload compiled Riftborn JAR
        uses: actions/upload-artifact@v4
        with:
          name: riftborn-2.0.0
          path: build/libs/riftborn-2.0.0.jar
          if-no-files-found: error
