name: Build and verify Riftborn
on:
  push:
    branches: [main, arena/01a07434-minecraft-test]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
concurrency:
  group: riftborn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Compile, check resources, and build distributable
        id: build
        run: |
          set -o pipefail
          ./gradlew --no-daemon build 2>&1 | tee build-log.txt
      - name: Publish diagnostic check
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('build-log.txt') ? fs.readFileSync('build-log.txt', 'utf8') : 'Build did not start.';
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'Riftborn verification details', head_sha: context.sha,
              status: 'completed', conclusion: '${{ steps.build.outcome }}' === 'success' ? 'success' : 'failure',
              output: {title: 'Java 21 / Minecraft 1.21.1 / Fabric', summary: 'Gradle build output (last 55 KB).', text: '```text\n' + log.slice(-55000) + '\n```'}
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riftborn-1.21.1
          path: |
            build/libs/*.jar
            build/reports/
            build/test-results/
            build-log.txt
